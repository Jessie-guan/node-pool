name: daily-node-refresh

# 每小时整点自动清洗节点池（UTC 0 分）
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}      # 也可以手动点一下立即跑

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install pyyaml

      - name: 采集节点（全网订阅源）
        run: python run.py collect

      - name: 测速清洗（mihomo 内核）
        run: python run.py probe

      - name: 生成极简配置
        run: python run.py build

      - name: 统计
        run: |
          echo "### 本次结果" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          pool = json.load(open("pool.json", encoding="utf-8")) if os.path.exists("pool.json") else []
          alive = json.load(open("alive.json", encoding="utf-8")) if os.path.exists("alive.json") else []
          print(f"- 采集节点：**{len(pool)}**")
          print(f"- 清洗后可用：**{len(alive)}**")
          print("")
          print("| 带宽 | 延迟 | 节点 |")
          print("|---|---|---|")
          for n in alive[:15]:
              print(f'| {n["_bps"]*8/1048576:.2f} Mbps | {n["_delay"]} ms | {n["name"][:36]} |')
          PY

      - name: 提交产物
        run: |
          git config user.name  "node-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dist/clash.yaml dist/sub.txt alive.json pool.json || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 节点池小时刷新 $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # 远程可能有人工提交，先 rebase 再推，避免 non-fast-forward
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || {
              echo "首次 push 失败，重试一次"
              sleep 3
              git pull --rebase --autostash origin main || true
              git push origin HEAD:main
            }
          fi
